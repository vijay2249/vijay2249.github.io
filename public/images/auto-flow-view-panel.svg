<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto"><path d="M0,0 L8,0 L4,7 Z" fill="#5a6b8c"/></marker>
  </defs>
  <rect width="1240" height="780" fill="#0b0e14"/>

  <!-- ============ PANEL ============ -->
  <rect x="36" y="36" width="528" height="716" rx="16" fill="#0d1320" stroke="#2b3650"/>
  <text x="56" y="74" font-size="16" font-weight="700" fill="#e6e9ef">TestNG Flow Preview</text>

  <!-- toolbar -->
  <rect x="56" y="92" width="30" height="28" rx="6" fill="#151b28" stroke="#2b3650"/>
  <circle cx="68" cy="103" r="5" fill="none" stroke="#9aa6bd" stroke-width="1.6"/>
  <line x1="72" y1="107" x2="77" y2="112" stroke="#9aa6bd" stroke-width="1.6"/>
  <rect x="92" y="92" width="150" height="28" rx="6" fill="#151b28" stroke="#2b3650"/>
  <text x="104" y="111" font-size="12" fill="#cfd6e6">All classes</text>
  <text x="226" y="111" font-size="11" fill="#9aa6bd">&#9662;</text>
  <rect x="250" y="92" width="98" height="28" rx="14" fill="#122a20" stroke="#2b6b4d"/>
  <text x="262" y="111" font-size="12" fill="#3ddc97">Results: on</text>
  <rect x="356" y="92" width="78" height="28" rx="6" fill="#15233f" stroke="#2b3650"/>
  <text x="368" y="111" font-size="12" fill="#8ea2ff">Refresh</text>

  <!-- class selector -->
  <rect x="56" y="132" width="452" height="30" rx="6" fill="#11182a" stroke="#2b3650"/>
  <text x="66" y="152" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#cfd6e6">flows/order/CreateOrderFlow.java</text>
  <text x="492" y="152" font-size="11" fill="#9aa6bd">&#9662;</text>

  <!-- summary banner -->
  <rect x="56" y="174" width="452" height="36" rx="8" fill="#11182a" stroke="#2b3650"/>
  <text x="72" y="197" font-size="12.5" fill="#3ddc97">&#10003; 0 passed</text>
  <text x="200" y="197" font-size="12.5" fill="#ff5f57">&#10005; 0 failed</text>
  <text x="330" y="197" font-size="12.5" fill="#9aa6bd">&#9675; 0 skipped</text>

  <!-- ===== CARD 1: createToken (normal) ===== -->
  <rect x="56" y="226" width="452" height="96" rx="10" fill="#151b28" stroke="#2b3650"/>
  <text x="64" y="261" font-size="14" fill="#3ddc97">&#8599;</text>
  <text x="82" y="261" font-size="14" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#e6e9ef">createToken</text>
  <rect x="404" y="244" width="88" height="22" rx="11" fill="#1b2233" stroke="#2b3650"/>
  <text x="448" y="259" font-size="10.5" text-anchor="middle" fill="#9aa6bd">&#183; NOT RUN</text>
  <text x="82" y="282" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#8ea2ff">TokenCreation</text>
  <text x="82" y="301" font-size="12" fill="#9aa6bd">Create auth token and initialize customer</text>
  <text x="82" y="316" font-size="11" fill="#6b7689">Line 26</text>

  <line x1="282" y1="324" x2="282" y2="343" stroke="#5a6b8c" stroke-width="2" marker-end="url(#dn)"/>

  <!-- ===== CARD 2: dataInitialization (Calls super) ===== -->
  <rect x="56" y="344" width="452" height="118" rx="10" fill="#151b28" stroke="#2b3650"/>
  <text x="64" y="379" font-size="14" fill="#3ddc97">&#8599;</text>
  <text x="82" y="379" font-size="14" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#e6e9ef">dataInitialization</text>
  <rect x="404" y="362" width="88" height="22" rx="11" fill="#1b2233" stroke="#2b3650"/>
  <text x="448" y="377" font-size="10.5" text-anchor="middle" fill="#9aa6bd">&#183; NOT RUN</text>
  <text x="82" y="400" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#8ea2ff">CreateOrderFlow</text>
  <text x="82" y="419" font-size="12" fill="#9aa6bd">data initialization step</text>
  <text x="82" y="434" font-size="11" fill="#6b7689">Line 30</text>
  <rect x="82" y="440" width="262" height="20" rx="6" fill="#131c33" stroke="#3a4a73"/>
  <text x="92" y="454" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#8ea2ff">Calls super.dataInitialization()</text>

  <line x1="282" y1="464" x2="282" y2="483" stroke="#5a6b8c" stroke-width="2" marker-end="url(#dn)"/>

  <!-- ===== CARD 3: createProposal (Params) ===== -->
  <rect x="56" y="484" width="452" height="118" rx="10" fill="#151b28" stroke="#2b3650"/>
  <text x="64" y="519" font-size="14" fill="#3ddc97">&#8599;</text>
  <text x="82" y="519" font-size="14" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#e6e9ef">createProposal</text>
  <rect x="404" y="502" width="88" height="22" rx="11" fill="#1b2233" stroke="#2b3650"/>
  <text x="448" y="517" font-size="10.5" text-anchor="middle" fill="#9aa6bd">&#183; NOT RUN</text>
  <text x="82" y="540" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#8ea2ff">BaseOrderFlow</text>
  <text x="82" y="559" font-size="12" fill="#9aa6bd">create proposal</text>
  <text x="82" y="574" font-size="11" fill="#6b7689">Line 346</text>
  <text x="82" y="595" font-size="11" fill="#ffb454">Params:</text>
  <rect x="132" y="580" width="280" height="20" rx="6" fill="#2a2113" stroke="#5a4524"/>
  <text x="142" y="594" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#ffd9a0">createProposalPayloadFilePath</text>

  <line x1="282" y1="604" x2="282" y2="623" stroke="#5a6b8c" stroke-width="2" marker-end="url(#dn)"/>

  <!-- ===== CARD 4: assertProposalDetails (normal) ===== -->
  <rect x="56" y="624" width="452" height="96" rx="10" fill="#151b28" stroke="#2b3650"/>
  <text x="64" y="659" font-size="14" fill="#3ddc97">&#8599;</text>
  <text x="82" y="659" font-size="14" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#e6e9ef">assertProposalDetails</text>
  <rect x="404" y="642" width="88" height="22" rx="11" fill="#1b2233" stroke="#2b3650"/>
  <text x="448" y="657" font-size="10.5" text-anchor="middle" fill="#9aa6bd">&#183; NOT RUN</text>
  <text x="82" y="680" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#8ea2ff">BaseOrderFlow</text>
  <text x="82" y="699" font-size="12" fill="#9aa6bd">assert proposal details</text>
  <text x="82" y="714" font-size="11" fill="#6b7689">Line 368</text>

  <!-- ===== numbered markers ===== -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="528" cy="147" r="11" fill="#3ddc97"/><text x="528" y="151" fill="#06210f">1</text>
    <circle cx="528" cy="192" r="11" fill="#3ddc97"/><text x="528" y="196" fill="#06210f">2</text>
    <circle cx="46" cy="261" r="11" fill="#3ddc97"/><text x="46" y="265" fill="#06210f">3</text>
    <circle cx="528" cy="255" r="11" fill="#3ddc97"/><text x="528" y="259" fill="#06210f">4</text>
    <circle cx="46" cy="450" r="11" fill="#3ddc97"/><text x="46" y="454" fill="#06210f">5</text>
    <circle cx="46" cy="590" r="11" fill="#3ddc97"/><text x="46" y="594" fill="#06210f">6</text>
  </g>

  <!-- ============ ANNOTATIONS ============ -->
  <text x="604" y="74" font-size="18" font-weight="700" fill="#e6e9ef">Anatomy of the flow panel</text>

  <g>
    <circle cx="616" cy="124" r="11" fill="#3ddc97"/><text x="616" y="128" font-size="12" font-weight="700" text-anchor="middle" fill="#06210f">1</text>
    <text x="640" y="120" font-size="14.5" font-weight="700" fill="#e6e9ef">Scope selector</text>
    <text x="640" y="142" font-size="13" fill="#9aa6bd">Pick the class (or method) to graph; "All classes"</text>
    <text x="640" y="160" font-size="13" fill="#9aa6bd">lists every TestNG class in the workspace.</text>

    <circle cx="616" cy="204" r="11" fill="#3ddc97"/><text x="616" y="208" font-size="12" font-weight="700" text-anchor="middle" fill="#06210f">2</text>
    <text x="640" y="200" font-size="14.5" font-weight="700" fill="#e6e9ef">Run summary</text>
    <text x="640" y="222" font-size="13" fill="#9aa6bd">passed / failed / skipped counts from the last run</text>
    <text x="640" y="240" font-size="13" fill="#9aa6bd">(all zero here &#8212; nothinghas run yet).</text>

    <circle cx="616" cy="284" r="11" fill="#3ddc97"/><text x="616" y="288" font-size="12" font-weight="700" text-anchor="middle" fill="#06210f">3</text>
    <text x="640" y="280" font-size="14.5" font-weight="700" fill="#e6e9ef">Step = one@Test method</text>
    <text x="640" y="302" font-size="13" fill="#9aa6bd">Cards are layered top-to-bottom by dependsOnMethods</text>
    <text x="640" y="320" font-size="13" fill="#9aa6bd">depth; the &#8599; icon jumps straight to the source.</text>

    <circle cx="616" cy="364" r="11" fill="#3ddc97"/><text x="616" y="368" font-size="12" font-weight="700" text-anchor="middle" fill="#06210f">4</text>
    <text x="640" y="360" font-size="14.5" font-weight="700" fill="#e6e9ef">Status badge</text>
    <text x="640" y="382" font-size="13" fill="#9aa6bd">NOT RUN now; turns green / red/ grey after a run</text>
    <text x="640" y="400" font-size="13" fill="#9aa6bd">when "Results: on" overlays the last outcome.</text>

    <circle cx="616" cy="444" r="11" fill="#3ddc97"/><text x="616" y="448" font-size="12" font-weight="700" text-anchor="middle" fill="#06210f">5</text>
    <text x="640" y="440" font-size="14.5" font-weight="700" fill="#e6e9ef">Inherited config step</text>
    <text x="640" y="462" font-size="13" fill="#9aa6bd">"Calls super.&#8230;" flags a step pulled from a base</text>
    <text x="640" y="480" font-size="13" fill="#9aa6bd">flow class (e.g. a @BeforeMethod / shared setup).</text>

    <circle cx="616" cy="524" r="11" fill="#3ddc97"/><text x="616" y="528" font-size="12" font-weight="700" text-anchor="middle" fill="#06210f">6</text>
    <text x="640" y="520" font-size="14.5" font-weight="700" fill="#e6e9ef">Parameterized step</text>
    <text x="640" y="542" font-size="13" fill="#9aa6bd">"Params: &#8230;" shows the @Parameters data file the</text>
    <text x="640" y="560" font-size="13" fill="#9aa6bd">step is driven with.</text>
  </g>

  <!-- toolbar notes (no marker) -->
  <line x1="604" y1="600" x2="1196" y2="600" stroke="#232c3d"/>
  <text x="604" y="632" font-size="13" fill="#9aa6bd"><tspan fill="#3ddc97" font-weight="700">Results: on</tspan> toggles the run overlay on the cards;</text>
  <text x="604" y="654" font-size="13" fill="#9aa6bd"><tspan fill="#8ea2ff" font-weight="700">Refresh</tspan> re-scans the source and rebuilds the graph.</text>
  <text x="604" y="684" font-size="12.5" fill="#6b7689">Reading the source only &#8212; opt-in, bounded, fully local (no network).</text>
</svg>