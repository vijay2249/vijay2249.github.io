<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="t1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5a6b8c"/></marker>
  </defs>
  <rect width="1000" height="380" fill="#0b0e14"/>

  <!-- summary banner -->
  <rect x="40" y="36" width="920" height="48" rx="10" fill="#0d1320" stroke="#2b3650"/>
  <text x="64" y="66" font-size="15" fill="#cfd6e6">last run:
    <tspan fill="#3ddc97" font-weight="700">3 passed</tspan>
    <tspan fill="#9aa6bd">&#183;</tspan>
    <tspan fill="#ff5f57" font-weight="700">1 failed</tspan>
    <tspan fill="#9aa6bd">&#183; 2m ago</tspan>
  </text>

  <!-- edges -->
  <line x1="220" y1="210" x2="356" y2="170" stroke="#5a6b8c" stroke-width="2.5" marker-end="url(#t1)"/>
  <line x1="220" y1="230" x2="356" y2="290" stroke="#5a6b8c" stroke-width="2.5" marker-end="url(#t1)"/>
  <line x1="520" y1="160" x2="676" y2="205" stroke="#5a6b8c" stroke-width="2.5" marker-end="url(#t1)"/>
  <line x1="520" y1="290" x2="676" y2="235" stroke="#5a6b8c" stroke-width="2.5" marker-end="url(#t1)"/>

  <!-- nodes -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" text-anchor="middle">
    <rect x="100" y="194" width="120" height="52" rx="12" fill="#151b28" stroke="#8ea2ff"/>
    <text x="160" y="226" fill="#8ea2ff">login</text>

    <rect x="360" y="138" width="160" height="52" rx="12" fill="#151b28" stroke="#28c840"/>
    <text x="440" y="164" fill="#28c840">order</text>
    <text x="440" y="182" font-size="11" fill="#9aa6bd">pass</text>

    <rect x="360" y="266" width="160" height="52" rx="12" fill="#151b28" stroke="#ff5f57"/>
    <text x="440" y="292" fill="#ff5f57">pay</text>
    <text x="440" y="310" font-size="11" fill="#9aa6bd">FAIL</text>

    <rect x="680" y="194" width="120" height="52" rx="12" fill="#151b28" stroke="#2b3650"/>
    <text x="740" y="226" fill="#9aa6bd">ship</text>
