<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8ea2ff"/></marker>
  </defs>
  <rect width="1120" height="760" fill="#0b0e14"/>

  <!-- CLI -->
  <rect x="360" y="30" width="400" height="64" rx="12" fill="#151b28" stroke="#3ddc97"/>
  <text x="560" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#3ddc97">webblock CLI</text>
  <text x="560" y="82" text-anchor="middle" font-size="13" fill="#9aa6bd">unprivileged &#183; validates input &#183; makes no policy decisions</text>
  <line x1="560" y1="94" x2="560" y2="140" stroke="#8ea2ff" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="575" y="122" font-size="13" fill="#9aa6bd">one JSON request / connection (/run/webblock.sock)</text>

  <!-- daemon container -->
  <rect x="120" y="150" width="880" height="500" rx="16" fill="#0d1320" stroke="#2b3650"/>
  <text x="140" y="180" font-size="15" font-weight="700" fill="#8ea2ff">webblockd  (root, CAP_NET_ADMIN only)</text>

  <!-- authz -->
  <rect x="360" y="200" width="400" height="70" rx="12" fill="#151b28" stroke="#2b3650"/>
  <text x="560" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9ef">authz</text>
  <text x="560" y="252" text-anchor="middle" font-size="13" fill="#9aa6bd">read SO_PEERCRED (kernel uid) &#8594; scope, validate, rate-limit</text>
  <line x1="560" y1="270" x2="560" y2="312" stroke="#8ea2ff" stroke-width="2.5" marker-end="url(#b)"/>

  <!-- engine -->
  <rect x="360" y="320" width="400" height="70" rx="12" fill="#151b28" stroke="#2b3650"/>
  <text x="560" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9ef">engine</text>
  <text x="560" y="372" text-anchor="middle" font-size="13" fill="#9aa6bd">serialize rebuilds;merge stored lists + resolved IPs</text>

  <!-- store + resolver -->
  <line x1="460" y1="390" x2="320" y2="442" stroke="#8ea2ff" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="660" y1="390" x2="800" y2="442" stroke="#8ea2ff" stroke-width="2.5" marker-end="url(#b)"/>
  <rect x="160" y="450" width="320" height="70" rx="12" fill="#151b28" stroke="#2b3650"/>
  <text x="320" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#e6e9ef">store</text>
  <text x="320" y="502" text-anchor="middle" font-size="13" fill="#9aa6bd">/var/lib/webblock (0700)</text>
  <rect x="640" y="450" width="320" height="70" rx="12" fill="#151b28" stroke="#2b3650"/>
  <text x="800" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#e6e9ef">resolver</text>
  <text x="800" y="502" text-anchor="middle" font-size="13" fill="#9aa6bd">domain &#8594; IPv4/IPv6, periodic refresh</text>

  <!-- backend -->
  <line x1="320" y1="520" x2="490" y2="560" stroke="#8ea2ff" stroke-width="2.5" marker-end="url(#b)"/>
  <rect x="360" y="566" width="400" height="70" rx="12" fill="#151b28" stroke="#3ddc97"/>
  <text x="560" y="594" text-anchor="middle" font-size="16" font-weight="700" fill="#3ddc97">backend</text>
  <text x="560" y="618" text-anchor="middle" font-size="13" fill="#9aa6bd">desired state &#8594; nftables / iptables+ipset, ONE atomic txn</text>

  <!-- kernel -->
  <line x1="560" y1="650" x2="560" y2="694" stroke="#ffb454" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="560" y="730" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb454">Linux kernel &#8212; netfilter egress hook (drop by destination IP)</text>
</svg>