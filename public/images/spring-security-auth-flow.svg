<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="1300" height="880" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="call" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3ddc97"/>
    </marker>
    <marker id="ret" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8ea2ff"/>
    </marker>
  </defs>

  <rect width="1300" height="880" fill="#0b0e14"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#e6e9ef">Spring Security authentication flow</text>
  <text x="40" y="76" font-size="15" fill="#9aa6bd">how a login request travels the filter chain and back</text>

  <!-- lifelines -->
  <g stroke="#232c3d" stroke-width="2" stroke-dasharray="4 6">
    <line x1="130" y1="170" x2="130" y2="828"/>
    <line x1="420" y1="170" x2="420" y2="828"/>
    <line x1="700" y1="170" x2="700" y2="828"/>
    <line x1="950" y1="170" x2="950" y2="828"/>
    <line x1="1180" y1="170" x2="1180" y2="828"/>
  </g>

  <!-- participant headers -->
  <g font-size="15" text-anchor="middle">
    <!-- Client -->
    <rect x="55" y="100" width="150" height="50" rx="10" fill="#151b28" stroke="#2b3650"/>
    <text x="130" y="130" fill="#e6e9ef" font-weight="700">Client</text>

    <!-- Authentication Filters -->
    <rect x="330" y="100" width="180" height="50" rx="10" fill="#10241c" stroke="#3ddc97"/>
    <text x="420" y="124" fill="#e6e9ef" font-weight="700">Authentication Filters</text>
    <text x="420" y="142" font-size="11" fill="#7f8aa3" font-family="ui-monospace, Menlo, monospace">UsernamePasswordAuthenticationFilter</text>

    <!-- AuthenticationManager -->
    <rect x="610" y="100" width="180" height="50" rx="10" fill="#151b28" stroke="#2b3650"/>
    <text x="700" y="124" fill="#e6e9ef" font-weight="700">AuthenticationManager</text>
    <text x="700" y="142" font-size="12" fill="#7f8aa3" font-family="ui-monospace, Menlo, monospace">ProviderManager</text>

    <!-- AuthenticationProvider -->
    <rect x="860" y="100" width="180" height="50" rx="10" fill="#151b28" stroke="#2b3650"/>
    <text x="950" y="124" fill="#e6e9ef" font-weight="700">AuthenticationProvider</text>
    <text x="950" y="142" font-size="11" fill="#7f8aa3" font-family="ui-monospace, Menlo, monospace">DaoAuthenticationProvider</text>

    <!-- UserDetailsService -->
    <rect x="1090" y="100" width="180" height="50" rx="10" fill="#151b28" stroke="#2b3650"/>
    <text x="1180" y="124" fill="#e6e9ef" font-weight="700">UserDetailsService</text>
    <text x="1180" y="142" font-size="11" fill="#7f8aa3" font-family="ui-monospace, Menlo, monospace">InMemoryUserDetailsManager</text>
  </g>

  <!-- messages -->
  <g font-size="14" fill="#cfd6e6" text-anchor="middle">
    <!-- 1 request -->
    <line x1="130" y1="210" x2="416" y2="210" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#call)"/>
    <text x="273" y="200" fill="#3ddc97">1. HTTP request</text>

    <!-- note: extract creds -->
    <rect x="305" y="232" width="230" height="46" rx="8" fill="#1a1408" stroke="#ffb454"/>
    <text x="420" y="252" font-size="12.5" fill="#ffd9a0">extract username / password,</text>
    <text x="420" y="270" font-size="12.5" fill="#ffd9a0">build UsernamePasswordAuthenticationToken</text>

    <!-- 2 authenticate -->
    <line x1="420" y1="320" x2="696" y2="320" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#call)"/>
    <text x="560" y="310" fill="#3ddc97">2. authenticate(token)</text>

    <!-- 3 authenticate -->
    <line x1="700" y1="375" x2="946" y2="375" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#call)"/>
    <text x="825" y="365" fill="#3ddc97">3. authenticate(token)</text>

    <!-- 4 loadUserByUsername -->
    <line x1="950" y1="430" x2="1176" y2="430" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#call)"/>
    <text x="1065" y="420" fill="#3ddc97">4. loadUserByUsername()</text>

    <!-- note: password encoder -->
    <rect x="835" y="452" width="230" height="40" rx="8" fill="#1a1408" stroke="#ffb454"/>
    <text x="950" y="477" font-size="12.5" fill="#ffd9a0">PasswordEncoder.matches(raw, stored)</text>

    <!-- 5 UserDetails return -->
    <line x1="1180" y1="534" x2="954" y2="534" stroke="#8ea2ff" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ret)"/>
    <text x="1067" y="524" fill="#8ea2ff">5. UserDetails</text>

    <!-- 6 Authentication return -->
    <line x1="950" y1="589" x2="704" y2="589" stroke="#8ea2ff" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ret)"/>
    <text x="827" y="579" fill="#8ea2ff">6. Authentication (authenticated)</text>

    <!-- 7 Authentication return to filters -->
    <line x1="700" y1="644" x2="424" y2="644" stroke="#8ea2ff" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ret)"/>
    <text x="562" y="634" fill="#8ea2ff">7. Authentication</text>

    <!-- note: security context -->
    <rect x="300" y="666" width="240" height="46" rx="8" fill="#08140f" stroke="#3ddc97"/>
    <text x="420" y="686" font-size="12.5" fill="#a7e9c9">store in SecurityContextHolder</text>
    <text x="420" y="704" font-size="12.5" fill="#a7e9c9">(thread-local SecurityContext)</text>

    <!-- 8 response -->
    <line x1="420" y1="756" x2="134" y2="756" stroke="#8ea2ff" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ret)"/>
    <text x="277" y="746" fill="#8ea2ff">8. HTTP response</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#9aa6bd">
    <line x1="40" y1="838" x2="78" y2="838" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#call)"/>
    <text x="86" y="842" text-anchor="start">call</text>
    <line x1="150" y1="838" x2="188" y2="838" stroke="#8ea2ff" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ret)"/>
    <text x="196" y="842" text-anchor="start">return</text>
  </g>
</svg>