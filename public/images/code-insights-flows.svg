<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 470" width="1420" height="470" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="f" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8ea2ff"/></marker>
    <style>
      .pill { fill:#151b28; stroke:#2b3650; }
      .pt { fill:#e6e9ef; font-size:13.5px; }
      .lbl { fill:#3ddc97; font-size:15px; font-weight:700; }
      .arr { stroke:#8ea2ff; stroke-width:2.5; }
      .note { fill:#9aa6bd; font-size:12.5px; }
    </style>
  </defs>
  <rect width="1420" height="470" fill="#0b0e14"/>

  <!-- Row 1: Coverage -->
  <text x="40" y="92" class="lbl">Coverage</text>
  <g>
    <rect class="pill" x="60" y="104" width="230" height="60" rx="10"/><text class="pt" x="175" y="140" text-anchor="middle">run mvn/gradle test</text>
    <line class="arr" x1="292" y1="134" x2="328" y2="134" marker-end="url(#f)"/>
    <rect class="pill" x="330" y="104" width="230" height="60" rx="10"/><text class="pt" x="445" y="140" text-anchor="middle">parse + merge jacoco.xml</text>
    <line class="arr" x1="562" y1="134" x2="598" y2="134" marker-end="url(#f)"/>
    <rect class="pill" x="600" y="104" width="200" height="60" rx="10"/><text class="pt" x="700" y="140" text-anchor="middle">exclude generated</text>
    <line class="arr" x1="802" y1="134" x2="838" y2="134" marker-end="url(#f)"/>
    <rect class="pill" x="840" y="104" width="220" height="60" rx="10"/><text class="pt" x="950" y="140" text-anchor="middle">render + gutter</text>
    <line class="arr" x1="1062" y1="134" x2="1098" y2="134" marker-end="url(#f)"/>
    <rect class="pill" x="1100" y="104" width="190" height="60" rx="10"/><text class="pt" x="1195" y="140" text-anchor="middle">open source</text>
  </g>

  <!-- Row 2: Rule sync -->
  <text x="40" y="232" class="lbl">Rule sync</text>
  <text x="135" y="232" class="note">(one time)</text>
  <g>
    <rect class="pill" x="60" y="244" width="230" height="60" rx="10"/><text class="pt" x="175" y="280" text-anchor="middle">setup URL + token</text>
    <line class="arr" x1="292" y1="274" x2="328" y2="274" marker-end="url(#f)"/>
    <rect class="pill" x="330" y="244" width="300" height="60" rx="10"/><text class="pt" x="480" y="280" text-anchor="middle">GET profile + active rules (paged)</text>
    <line class="arr" x1="632" y1="274" x2="668" y2="274" marker-end="url(#f)"/>
    <rect class="pill" x="670" y="244" width="210" height="60" rx="10" stroke="#ffb454"/><text class="pt" x="775" y="280" text-anchor="middle" fill="#ffd9a0">cache on disk</text>
    <text x="900" y="279" class="note">[ the only network call ]</text>
  </g>

  <!-- Row 3: Analysis -->
  <text x="40" y="372" class="lbl">Analysis</text>
  <g>
    <rect class="pill" x="60" y="384" width="190" height="60" rx="10"/><text class="pt" x="155" y="420" text-anchor="middle">pick engine</text>
    <line class="arr" x1="252" y1="414" x2="288" y2="414" marker-end="url(#f)"/>
    <rect class="pill" x="290" y="384" width="320" height="60" rx="10"/><text class="pt" x="450" y="420" text-anchor="middle">spawn JVM (sources+rules+classpath)</text>
    <line class="arr" x1="612" y1="414" x2="648" y2="414" marker-end="url(#f)"/>
    <rect class="pill" x="650" y="384" width="180" height="60" rx="10"/><text class="pt" x="740" y="420" text-anchor="middle">issues JSON</text>
    <line class="arr" x1="832" y1="414" x2="868" y2="414" marker-end="url(#f)"/>
    <rect class="pill" x="870" y="384" width="220" height="60" rx="10"/><text class="pt" x="980" y="420" text-anchor="middle">squiggles + panel</text>
  </g>
</svg>