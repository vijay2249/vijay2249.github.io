<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 260" width="1320" height="260" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="u" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8ea2ff"/></marker>
    <style>
      .pill { fill:#151b28; stroke:#2b3650; }
      .pt { fill:#e6e9ef; font-size:13.5px; font-weight:600; }
      .ps { fill:#9aa6bd; font-size:11.5px; }
      .ar { stroke:#8ea2ff; stroke-width:2.5; }
    </style>
  </defs>
  <rect width="1320" height="260" fill="#0b0e14"/>
  <text x="40" y="48" font-size="17" font-weight="700" fill="#e6e9ef">One command collapses the upgrade pipeline</text>

  <g>
    <rect class="pill" x="40" y="96" width="180" height="84" rx="12" stroke="#3ddc97"/>
    <text class="pt" x="130" y="134" text-anchor="middle" fill="#3ddc97">upgrade_ms</text>
    <text class="ps" x="130" y="156" text-anchor="middle">one CLI command</text>
    <line class="ar" x1="222" y1="138" x2="256" y2="138" marker-end="url(#u)"/>

    <rect class="pill" x="258" y="96" width="180" height="84" rx="12"/>
    <text class="pt" x="348" y="134" text-anchor="middle">pull chart</text>
    <text class="ps" x="348" y="156" text-anchor="middle">from Nexus</text>
    <line class="ar" x1="440" y1="138" x2="474" y2="138" marker-end="url(#u)"/>

    <rect class="pill" x="476" y="96" width="180" height="84" rx="12"/>
    <text class="pt" x="566" y="134" text-anchor="middle">login</text>
    <text class="ps" x="566" y="156" text-anchor="middle">to OpenShift (OCP)</text>
    <line class="ar" x1="658" y1="138" x2="692" y2="138" marker-end="url(#u)"/>

    <rect class="pill" x="694" y="96" width="200" height="84" rx="12"/>
    <text class="pt" x="794" y="134" text-anchor="middle">helm template</text>
    <text class="ps" x="794" y="156" text-anchor="middle">values + overrides</text>
    <line class="ar" x1="896" y1="138" x2="930" y2="138" marker-end="url(#u)"/>

    <rect class="pill" x="932" y="96" width="180" height="84" rx="12"/>
    <text class="pt" x="1022" y="134" text-anchor="middle">apply / rollout</text>
    <text class="ps" x="1022" y="156" text-anchor="middle">deploy new version</text>
    <line class="ar" x1="1114" y1="138" x2="1148" y2="138" marker-end="url(#u)"/>

    <rect class="pill" x="1150" y="96" width="150" height="84" rx="12" stroke="#ffb454"/>
    <text class="pt" x="1225" y="134" text-anchor="middle" fill="#ffd9a0">verify</text>
    <text class="ps" x="1225" y="156" text-anchor="middle">rollout status</text>
  </g>
</svg>