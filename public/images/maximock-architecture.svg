<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3ddc97"/></marker>
    <marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ffb454"/></marker>
  </defs>
  <rect width="1100" height="420" fill="#0b0e14"/>
  <text x="40" y="44" font-size="17" font-weight="700" fill="#e6e9ef">API mocking thatlives in your build</text>

  <!-- tests -->
  <rect x="40" y="100" width="260" height="120" rx="12" fill="#151b28" stroke="#8ea2ff"/>
  <text x="170" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#8ea2ff">JUnit / Maven</text>
  <text x="170" y="166" text-anchor="middle" font-size="13" fill="#9aa6bd">defines stubs in code</text>
  <text x="170" y="190" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#cfd6e6">stub(get("/x")).reply(200)</text>

  <line x1="302" y1="160" x2="376" y2="160" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#m)"/>

  <!-- maximock -->
  <rect x="380" y="84" width="320" height="152" rx="12" fill="#0d1320" stroke="#3ddc97"/>
  <text x="540" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#3ddc97">maximock (WireMock)</text>
  <text x="540" y="150" text-anchor="middle" font-size="13.5" fill="#9aa6bd">stub registry + request matchers</text>
  <text x="540" y="176" text-anchor="middle" font-size="13.5" fill="#9aa6bd">starts anembedded HTTP server</text>
  <text x="540" y="206" text-anchor="middle" font-size="12.5" fill="#6b7689">versioned, reviewable, runs in CI</text>

  <line x1="702" y1="160" x2="776" y2="160" stroke="#3ddc97" stroke-width="2.5" marker-end="url(#m)"/>

  <!-- server -->
  <rect x="780" y="100" width="280" height="120" rx="12" fill="#151b28" stroke="#2b3650"/>
  <text x="920" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9ef">Local HTTP endpoint</text>
  <text x="920" y="166" text-anchor="middle" font-size="13" font-family="ui-monospace,Menlo, monospace" fill="#cfd6e6">http://localhost:port</text>
  <text x="920" y="190" text-anchor="middle" font-size="13" fill="#9aa6bd">returns canned responses</text>

  <!-- SUT -->
  <rect x="640" y="300" width="280" height="80" rx="12" fill="#151b28" stroke="#ffb454"/>
  <text x="780" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#ffb454">code under test</text>
  <text x="780" y="360" text-anchor="middle" font-size="12.5" fill="#9aa6bd">calls it like a real API</text>
  <line x1="880" y1="300" x2="912" y2="224" stroke="#ffb454" stroke-width="2.5" marker-end="url(#m2)"/>
  <text x="905" y="270" font-size="12" fill="#ffb454">HTTP</text>
</svg>