<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#101a26"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="240" cy="520" r="240" fill="#3ddc97" opacity="0.10"/>
  <g font-family="-apple-system, Segoe UI, Roboto, sans-serif">
    <text x="90" y="150" font-size="50" font-weight="800" fill="#e6e9ef">Fair fare-splitting</text>
    <text x="90" y="212" font-size="50" font-weight="800" fill="#3ddc97">for pooled rides</text>
    <text x="90" y="268" font-size="25" fill="#9aa6bd">surplus sharing &#183; individual rationality &#183; Shapley</text>
  </g>
  <g transform="translate(120, 360)" font-family="ui-monospace, Menlo, monospace" font-size="18">
    <circle cx="0" cy="40" r="14" fill="#3ddc97"/><text x="0" y="86" text-anchor="middle" fill="#9aa6bd">A pick</text>
    <circle cx="250" cy="40" r="14" fill="#8ea2ff"/><text x="250" y="86" text-anchor="middle" fill="#9aa6bd">B pick</text>
    <circle cx="600" cy="40" r="14" fill="#3ddc97"/><text x="600" y="86" text-anchor="middle" fill="#9aa6bd">A drop</text>
    <circle cx="900" cy="40" r="14" fill="#8ea2ff"/><text x="900" y="86" text-anchor="middle" fill="#9aa6bd">B drop</text>
    <line x1="0" y1="40" x2="900" y2="40" stroke="#232c3d" stroke-width="4"/>
    <text x="125" y="22" text-anchor="middle" fill="#6b7689" font-size="14">{A}</text>
    <text x="425" y="22" text-anchor="middle" fill="#3ddc97" font-size="14">{A,B} shared</text>
    <text x="750" y="22" text-anchor="middle" fill="#6b7689" font-size="14">{B}</text>
  </g>
</svg>